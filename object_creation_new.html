<html>
    <head></head>
    <body>
 
 <h2>Creating an object using new keyword</h2>
 <p id="demo"></p>

 <script>
    //creating an object using new keyword
    const person=new Object({
        name:"Apeksha",
        age:25,
        city:"Pune"
        
    });

    //accessing object properties
    document.getElementById("demo").innerHTML="The person name is"+person.name+ " and the city is "+person.city;
 </script>
    </body>
        
</html>
