<html>
    <head></head>
    <body>
        <h3> string in javascpript</h3>
        <p>string are for storing text</p>
        <p>The length of the string is:</p>
        <p id="string"></p>
        
        <script>
            let text="Hello Apeksha";
            let name=`She's a good and a \"beautiful\" girl`;
            document.getElementById("string").innerHTML=text;
            document.getElementById("string").innerHTML=text.length;
            document.getElementById("string").innerHTML=name;
            document.getElementById("string").innerHTML=name.length;
            document.getElementById("string").innerHTML=name.toUpperCase();
            document.getElementById("string").innerHTML=name.toLowerCase();
        </script>
    </body>
</html>
