<html>
    <head></head>
    <body>
        <h2>creating an empty object in javascript</h2>
        <p id="demo"></p>

     <script>
          // creating an empty object using object literal syntax
        const Book={};

       Book.Name="JavaScript Guide";
       Book.author="MDN web services team";
       Book.pages=350;

       //accessing object properties
       document.getElementById("demo").innerHTML="The Book name is "+Book.Name+ " and the author is "+Book.author;

        </script>

    </body>
</html>
