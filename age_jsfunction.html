<html>
    <head>
        <title>age js function</title>  
    </head>
    <body>
        <script>

            function checkage(age)
            {
                if(age>=18)
                {
                    alert("Eligible for voting");
                }
                    else
                {
                    alert("Not eligible for voting");
                }
            }
            var age=prompt("Enter your age:");
            //document.write("Your age is: " + age + "<br>");
            checkage(age);
            
        </script>
        </body>
</html>
