<html>
    <head>
        <title>Positive number</title>

    </head>
    <body>
        <script>
            function checkpositive(num)
            {
                if(num>0)
            {
                alert(+num+" is a positive number");

            }
            else if(num<0)
            {
                alert(+num+" is a negative number");
            
            }
            else{
                alert("The number is zero");
            }
            }
            let num=prompt("Enter a number:");
            checkpositive(num);
        </script>
    </body>
</html>
