<html>
    <head></head>
    <body>
        <script>

    
            //  create object
            const student={
                name:"Apeksha",
                age:22,
                Grade:"A",
                Course:"BE Computer"
            }

            // access object properties
            console.log(student.name); // Output: Apeksha
            console.log(student.age); // Output: 22
            console.log(student.Grade); // Output: A
            console.log(student.Course); // Output: BE Computer 
            // modify object properties
            student.age=23;
            console.log(student.age); // Output: 23
            // add new property
            student.email="appu@gmail.com";
            console.log(student.email); // Output: appu@gmail.com
        </script>
    </body>
</html>
